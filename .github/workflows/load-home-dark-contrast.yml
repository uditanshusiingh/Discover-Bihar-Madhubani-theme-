name: Load home dark contrast stylesheet

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add shared stylesheet to home
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          href = 'css/home-dark-contrast.css'
          if href not in text:
              link = f'    <link rel="stylesheet" href="{href}">\n'
              marker = 'madhubani-theme.css'
              pos = text.find(marker)
              if pos >= 0:
                  end = text.find('\n', pos)
                  text = text[:end + 1] + link + text[end + 1:]
              else:
                  head_end = text.lower().find('</head>')
                  text = text[:head_end] + link + text[head_end:]
              path.write_text(text, encoding='utf-8')
      - name: Commit stylesheet link
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: load home dark contrast stylesheet"
          git push
