name: Apply Section Contrast Modifiers

on:
  workflow_run:
    workflows: ["Sync Discover Bihar + Madhubani Theme"]
    types: [completed]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate shared section contrast layer
        run: |
          mkdir -p css js
          cat > css/section-contrast.css <<'CSS'
          /* Section-aware contrast for alternating light/dark surfaces. */
          :root {
              --section-muted-light-bg: #6B5A47;
              --section-accent-light-bg: #7D1A2D;
              --section-muted-dark-bg: #FFF9EC;
              --section-accent-dark-bg: #F0C56B;
          }

          /* Dark mode + cream section: use warm dark text. */
          :is([data-theme="dark"],[data-bs-theme="dark"],.dark-mode,.dark,body.dark) .section-light {
              color: var(--section-muted-light-bg) !important;
          }
          :is([data-theme="dark"],[data-bs-theme="dark"],.dark-mode,.dark,body.dark) .section-light h1,
          :is([data-theme="dark"],[data-bs-theme="dark"],.dark-mode,.dark,body.dark) .section-light h2,
          :is([data-theme="dark"],[data-bs-theme="dark"],.dark-mode,.dark,body.dark) .section-light h3,
          :is([data-theme="dark"],[data-bs-theme="dark"],.dark-mode,.dark,body.dark) .section-light h4,
          :is([data-theme="dark"],[data-bs-theme="dark"],.dark-mode,.dark,body.dark) .section-light h5,
          :is([data-theme="dark"],[data-bs-theme="dark"],.dark-mode,.dark,body.dark) .section-light h6 {
              color: var(--section-muted-light-bg) !important;
              opacity: 1 !important;
          }
          :is([data-theme="dark"],[data-bs-theme="dark"],.dark-mode,.dark,body.dark) .section-light h1 span,
          :is([data-theme="dark"],[data-bs-theme="dark"],.dark-mode,.dark,body.dark) .section-light h2 span,
          :is([data-theme="dark"],[data-bs-theme="dark"],.dark-mode,.dark,body.dark) .section-light h1 em,
          :is([data-theme="dark"],[data-bs-theme="dark"],.dark-mode,.dark,body.dark) .section-light h2 em {
              color: var(--section-accent-light-bg) !important;
          }
          :is([data-theme="dark"],[data-bs-theme="dark"],.dark-mode,.dark,body.dark) .section-light p,
          :is([data-theme="dark"],[data-bs-theme="dark"],.dark-mode,.dark,body.dark) .section-light .text-muted,
          :is([data-theme="dark"],[data-bs-theme="dark"],.dark-mode,.dark,body.dark) .section-light .section-subtitle,
          :is([data-theme="dark"],[data-bs-theme="dark"],.dark-mode,.dark,body.dark) .section-light .philosophy-text,
          :is([data-theme="dark"],[data-bs-theme="dark"],.dark-mode,.dark,body.dark) .section-light .philosophy-text p,
          :is([data-theme="dark"],[data-bs-theme="dark"],.dark-mode,.dark,body.dark) .section-light .about-project-lead {
              color: var(--section-muted-light-bg) !important;
              opacity: 1 !important;
          }
          :is([data-theme="dark"],[data-bs-theme="dark"],.dark-mode,.dark,body.dark) .section-light .section-label,
          :is([data-theme="dark"],[data-bs-theme="dark"],.dark-mode,.dark,body.dark) .section-light .section-eyebrow,
          :is([data-theme="dark"],[data-bs-theme="dark"],.dark-mode,.dark,body.dark) .section-light [class*="view-link"],
          :is([data-theme="dark"],[data-bs-theme="dark"],.dark-mode,.dark,body.dark) .section-light .view-all-link {
              color: var(--section-accent-light-bg) !important;
          }
          :is([data-theme="dark"],[data-bs-theme="dark"],.dark-mode,.dark,body.dark) .section-light .philosophy-content h3,
          :is([data-theme="dark"],[data-bs-theme="dark"],.dark-mode,.dark,body.dark) .section-light .philosophy-content h3 em {
              color: var(--theme-text-primary) !important;
          }

          /* Dark sections retain light text. */
          .section-dark .hero-scroll,
          .section-dark .history-hero-scroll,
          .section-dark .about-hero-scroll {
              color: var(--section-muted-dark-bg) !important;
          }
          .section-dark .hero-scroll i,
          .section-dark .history-hero-scroll i,
          .section-dark .about-hero-scroll i {
              color: var(--section-accent-dark-bg) !important;
          }

          /* If a hero is intentionally light, make its scroll label readable. */
          :is([data-theme="dark"],[data-bs-theme="dark"],.dark-mode,.dark,body.dark) .section-light .hero-scroll,
          :is([data-theme="dark"],[data-bs-theme="dark"],.dark-mode,.dark,body.dark) .section-light .history-hero-scroll,
          :is([data-theme="dark"],[data-bs-theme="dark"],.dark-mode,.dark,body.dark) .section-light .about-hero-scroll {
              color: var(--section-accent-light-bg) !important;
          }
          CSS

          cat > js/section-theme.js <<'JS'
          /* Assign section-light/section-dark from the rendered background. */
          (function () {
              function rgb(value) {
                  const m = value && value.match(/rgba?\\(([^)]+)\\)/i);
                  if (!m) return null;
                  const p = m[1].split(',').map(v => v.trim());
                  if (p.length < 3) return null;
                  const a = p[3] === undefined ? 1 : Number(p[3]);
                  if (!a) return null;
                  return p.slice(0, 3).map(Number);
              }
              function lum(c) {
                  const v = c.map(x => { x /= 255; return x <= .04045 ? x / 12.92 : Math.pow((x + .055) / 1.055, 2.4); });
                  return .2126 * v[0] + .7152 * v[1] + .0722 * v[2];
              }
              function bg(el) {
                  let n = el;
                  while (n && n.nodeType === 1) {
                      const c = rgb(getComputedStyle(n).backgroundColor);
                      if (c) return c;
                      n = n.parentElement;
                  }
                  return [18,24,32];
              }
              function apply() {
                  document.querySelectorAll('.section-auto').forEach(el => {
                      el.classList.remove('section-light', 'section-dark');
                      const name = String(el.className || '').toLowerCase();
                      if (/(^|[\\s_-])(hero|gallery|travel|explore)([\\s_-]|$)/.test(name) || name.includes('history-hero') || name.includes('about-hero')) {
                          el.classList.add('section-dark');
                          return;
                      }
                      el.classList.add(lum(bg(el)) > .45 ? 'section-light' : 'section-dark');
                  });
              }
              function start() {
                  apply();
                  new MutationObserver(apply).observe(document.documentElement, {attributes:true, attributeFilter:['class','data-theme','data-bs-theme']});
                  window.addEventListener('resize', apply, {passive:true});
              }
              document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', start, {once:true}) : start();
          })();
          JS

          python3 - <<'PY'
          from pathlib import Path
          import re
          pages=[Path('index.html'), *Path('pages').glob('*.html')]
          for p in pages:
              s=p.read_text(encoding='utf-8')
              css='css/section-contrast.css' if p.name=='index.html' else '../css/section-contrast.css'
              js='js/section-theme.js' if p.name=='index.html' else '../js/section-theme.js'
              if 'section-contrast.css' not in s:
                  s=s.replace('</head>', f'    <link rel="stylesheet" href="{css}">\n</head>', 1)
              if 'section-theme.js' not in s:
                  s=s.replace('</body>', f'    <script src="{js}"></script>\n</body>', 1)
              s=re.sub(r'<section(?![^>]*\\bsection-auto\\b)([^>]*)>', r'<section class="section-auto"\\1>', s)
              s=re.sub(r'<header(?![^>]*\\bsection-auto\\b)([^>]*class="[^\"]*(?:hero|history-hero)[^\"]*"[^>]*)>', r'<header class="section-auto"\\1>', s)
              p.write_text(s,encoding='utf-8')
          PY

      - name: Commit section contrast fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/section-contrast.css js/section-theme.js index.html pages/*.html
          git commit -m "fix: add section-aware dark mode contrast [skip ci]" || exit 0
          git push
