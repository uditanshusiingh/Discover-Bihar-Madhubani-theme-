name: Sync Discover Bihar + Madhubani Theme

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preserve theme and sync source
        run: |
          cp css/madhubani-theme.css /tmp/madhubani-theme.css
          git clone --depth 1 https://github.com/uditanshusiingh/Discover-Bihar.git /tmp/source
          rsync -a --delete --exclude '.git' --exclude '.github/' /tmp/source/ ./
          mkdir -p css
          cp /tmp/madhubani-theme.css css/madhubani-theme.css

      - name: Inject theme into every HTML page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pages=[Path('index.html'), *Path('pages').glob('*.html')]
          for p in pages:
              s=p.read_text(encoding='utf-8')
              rel='css/madhubani-theme.css' if p.name=='index.html' else '../css/madhubani-theme.css'
              if 'madhubani-theme.css' not in s:
                  s=s.replace('</head>', f'    <link rel="stylesheet" href="{rel}">\n</head>', 1)
              if 'family=Eczar' not in s:
                  fonts='    <link rel="preconnect" href="https://fonts.googleapis.com">\n    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n    <link href="https://fonts.googleapis.com/css2?family=Eczar:wght@400;500;600;700&family=Yatra+One&display=swap" rel="stylesheet">\n'
                  s=s.replace('</head>', fonts+'</head>', 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Audit and replace hardcoded theme colors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib

          ROOT = Path('.')
          files = [p for ext in ('*.css','*.scss','*.html') for p in ROOT.rglob(ext)
                   if '.git' not in p.parts and '.github' not in p.parts]

          # One semantic token system. Values are deliberately high-contrast in both themes.
          token_block = r'''
          /* =========================================================
             THEME TOKENS — centralized light/dark color system
             ========================================================= */
          :root {
              --theme-text-primary: #2F241F;
              --theme-text-secondary: #6C5A50;
              --theme-text-on-dark: #FFF9EC;
              --theme-bg-primary: #FDF6E3;
              --theme-bg-secondary: #FFF9EC;
              --theme-bg-dark: #142D52;
              --theme-border: #D7BFA8;
              --theme-border-strong: #A6243B;
              --theme-accent: #A6243B;
              --theme-accent-2: #E8A33D;
              --theme-link: #1C3F72;
              --theme-icon: #A6243B;
              --theme-shadow: rgba(20,45,82,.18);
              --theme-overlay: rgba(20,45,82,.78);
              --theme-white: #FFFDF7;
              --theme-black: #2F241F;
          }

          [data-theme="dark"],
          [data-bs-theme="dark"],
          .dark-mode,
          .dark,
          body.dark {
              --theme-text-primary: #FDF6E3;
              --theme-text-secondary: #E8D8C8;
              --theme-text-on-dark: #FFF9EC;
              --theme-bg-primary: #121820;
              --theme-bg-secondary: #1C2430;
              --theme-bg-dark: #0C1624;
              --theme-border: #44505F;
              --theme-border-strong: #D46A7E;
              --theme-accent: #D46A7E;
              --theme-accent-2: #F0C56B;
              --theme-link: #8DB7FF;
              --theme-icon: #F0C56B;
              --theme-shadow: rgba(0,0,0,.45);
              --theme-overlay: rgba(0,0,0,.72);
              --theme-white: #FDF6E3;
              --theme-black: #FDF6E3;
          }

          @media (prefers-color-scheme: dark) {
              :root:not([data-theme="light"]) {
                  --theme-text-primary: #FDF6E3;
                  --theme-text-secondary: #E8D8C8;
                  --theme-text-on-dark: #FFF9EC;
                  --theme-bg-primary: #121820;
                  --theme-bg-secondary: #1C2430;
                  --theme-bg-dark: #0C1624;
                  --theme-border: #44505F;
                  --theme-border-strong: #D46A7E;
                  --theme-accent: #D46A7E;
                  --theme-accent-2: #F0C56B;
                  --theme-link: #8DB7FF;
                  --theme-icon: #F0C56B;
                  --theme-shadow: rgba(0,0,0,.45);
                  --theme-overlay: rgba(0,0,0,.72);
                  --theme-white: #FDF6E3;
                  --theme-black: #FDF6E3;
              }
          }
          '''

          # Existing shared theme file gets the canonical token block. Other files are
          # rewritten so hardcoded colors become var(--theme-*) references.
          theme = Path('css/madhubani-theme.css')
          original_theme = theme.read_text(encoding='utf-8') if theme.exists() else ''
          if 'THEME TOKENS — centralized light/dark color system' not in original_theme:
              theme.write_text(token_block + '\n' + original_theme, encoding='utf-8')

          HEX = re.compile(r'#[0-9a-fA-F]{3,8}\b')
          FUNC = re.compile(r'(?<![\w-])(?:rgb|rgba|hsl|hsla)\([^)]*\)', re.I)
          NAMED = re.compile(r'(?<![\w-])(white|black|gray|grey|silver|maroon|navy|yellow|orange|red|blue|green|purple)(?![\w-])', re.I)
          ALL = re.compile(r'#[0-9a-fA-F]{3,8}\b|(?<![\w-])(?:rgb|rgba|hsl|hsla)\([^)]*\)|(?<![\w-])(?:white|black|gray|grey|silver|maroon|navy|yellow|orange|red|blue|green|purple)(?![\w-])', re.I)

          palette = {
              '#A6243B': '--theme-accent', '#7D1A2D': '--theme-accent',
              '#E8A33D': '--theme-accent-2', '#F3C66D': '--theme-accent-2',
              '#1C3F72': '--theme-link', '#142D52': '--theme-bg-dark',
              '#FDF6E3': '--theme-bg-primary', '#FFF9EC': '--theme-bg-secondary',
              '#2F241F': '--theme-text-primary', '#6C5A50': '--theme-text-secondary',
              '#FFFDF7': '--theme-white', '#FFFFFF': '--theme-white', '#fff': '--theme-white',
              '#000000': '--theme-black', '#000': '--theme-black',
              '#8B4513': '--theme-accent', '#D4A017': '--theme-accent-2',
              '#1B1B1B': '--theme-text-primary', '#F8F5EF': '--theme-bg-primary',
              '#333333': '--theme-text-primary', '#777777': '--theme-text-secondary',
          }

          def context(text, pos):
              start = max(text.rfind('{', 0, pos), text.rfind(';', 0, pos), text.rfind('>', 0, pos)) + 1
              left = text[start:pos].lower()
              m = re.search(r'([\w-]+)\s*:\s*[^:]*$', left)
              if m: return m.group(1)
              m = re.search(r'(?:fill|stroke|stop-color)\s*=\s*$', left)
              if m: return 'fill'
              return ''

          def token_for(raw, prop):
              low = raw.lower().replace(' ', '')
              if low == 'transparent': return None
              if raw in palette: return palette[raw]
              # Normalize equivalent casing for the common palette.
              if raw.upper() in palette: return palette[raw.upper()]
              if low in ('white','#fff','#ffffff'):
                  return '--theme-text-on-dark' if prop in ('color','fill','stroke') else '--theme-bg-secondary'
              if low in ('black','#000','#000000'):
                  return '--theme-text-primary' if prop in ('color','fill','stroke') else '--theme-bg-dark'
              if low in ('gray','grey','silver'):
                  return '--theme-text-secondary' if prop in ('color','fill','stroke') else '--theme-border'
              if prop in ('box-shadow','text-shadow','filter'): return '--theme-shadow'
              if prop in ('border','border-color','outline','outline-color','column-rule-color','text-decoration-color'): return '--theme-border'
              if prop in ('background','background-color','background-image'): return '--theme-bg-secondary'
              if prop in ('color','fill','stroke','stop-color','caret-color'):
                  return '--theme-text-primary'
              return '--theme-border'

          report=[]
          for p in files:
              s=p.read_text(encoding='utf-8')
              original=s
              replacements={}
              def repl(m):
                  raw=m.group(0)
                  prop=context(s,m.start())
                  token=token_for(raw, prop)
                  if not token: return raw
                  replacements[raw]=token
                  return f'var({token})'
              s=ALL.sub(repl,s)
              if s != original:
                  p.write_text(s, encoding='utf-8')
                  report.append((str(p), replacements))

          # Append a final safety layer for controls/placeholders and high-risk surfaces.
          safety = r'''
          /* =========================================================
             THEME SAFETY — high-risk contrast surfaces
             ========================================================= */
          html, body { background-color: var(--theme-bg-primary); color: var(--theme-text-primary); }
          input, textarea, select, button { color: var(--theme-text-primary); background-color: var(--theme-bg-secondary); border-color: var(--theme-border); }
          input::placeholder, textarea::placeholder { color: var(--theme-text-secondary); opacity: 1; }
          input:disabled, textarea:disabled, select:disabled, button:disabled { color: var(--theme-text-secondary); background-color: var(--theme-bg-secondary); border-color: var(--theme-border); opacity: .78; }
          a { color: var(--theme-link); }
          code, pre, kbd, samp { color: var(--theme-text-primary); background-color: var(--theme-bg-secondary); border-color: var(--theme-border); }
          table, thead, tbody, tr, th, td { border-color: var(--theme-border); }
          th { color: var(--theme-text-primary); background-color: var(--theme-bg-secondary); }
          td { color: var(--theme-text-primary); background-color: var(--theme-bg-primary); }
          [role="tooltip"], .tooltip, .popover, .modal-content, .dropdown-menu { color: var(--theme-text-primary); background-color: var(--theme-bg-secondary); border-color: var(--theme-border); }
          svg [fill], svg [stroke] { vector-effect: non-scaling-stroke; }
          '''
          with theme.open('a', encoding='utf-8') as f:
              f.write('\n' + safety + '\n')

          # Produce a human-readable audit summary for spot-checking.
          out=['# Light/Dark Theme Audit','',f'Scanned {len(files)} CSS/SCSS/HTML files.','', '## Modified files']
          for name, reps in report:
              out.append(f'- `{name}` — {len(reps)} distinct hardcoded color literals replaced')
              for raw,tok in sorted(reps.items()): out.append(f'  - `{raw}` → `var({tok})`')
          out += ['', '## Contrast tokens (WCAG AA target)', '- Light: `--theme-text-primary` / `--theme-bg-primary`, `--theme-text-secondary` / `--theme-bg-primary`, `--theme-link` / `--theme-bg-primary`, and `--theme-accent` / `--theme-bg-primary` are selected above 4.5:1.', '- Dark: `--theme-text-primary` / `--theme-bg-primary`, `--theme-text-secondary` / `--theme-bg-primary`, `--theme-link` / `--theme-bg-primary`, and `--theme-accent` / `--theme-bg-primary` are selected above 4.5:1.']
          Path('THEME_AUDIT.md').write_text('\n'.join(out)+'\n', encoding='utf-8')
          print('\n'.join(out))
          PY

      - name: Commit full themed and audited site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: centralize light dark theme colors and audit contrast [skip ci]" || exit 0
          git push
