name: Apply global visibility fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add shared visibility stylesheet to every HTML page
        shell: python
        run: |
          from pathlib import Path

          pages = [Path('index.html')] + sorted(Path('pages').glob('*.html'))
          changed = []

          for path in pages:
              text = path.read_text(encoding='utf-8')
              href = 'css/visibility-fix.css' if path.parent == Path('.') else '../css/visibility-fix.css'

              if href in text:
                  continue

              link = f'    <link rel="stylesheet" href="{href}">\n'
              marker = 'madhubani-theme.css'
              pos = text.find(marker)

              if pos >= 0:
                  end = text.find('\n', pos)
                  if end < 0:
                      end = len(text)
                  text = text[:end + 1] + link + text[end + 1:]
              else:
                  head_end = text.lower().find('</head>')
                  if head_end < 0:
                      continue
                  text = text[:head_end] + link + text[head_end:]

              path.write_text(text, encoding='utf-8')
              changed.append(str(path))

          print('Updated:', ', '.join(changed) if changed else 'none')

      - name: Commit shared stylesheet links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html pages/*.html
          if git diff --cached --quiet; then
            echo "No HTML changes needed."
            exit 0
          fi
          git commit -m "fix: load global visibility theme on every page"
          git push
