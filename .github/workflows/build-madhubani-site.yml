name: Build Madhubani Theme

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4

      - name: Copy original Discover Bihar project
        run: |
          git clone --depth 1 https://github.com/uditanshusiingh/Discover-Bihar.git /tmp/discover-bihar
          rm -rf ./* ./.??* 2>/dev/null || true
          cp -R /tmp/discover-bihar/. .
          rm -rf .git
          git init
          git remote add origin https://github.com/${{ github.repository }}.git
          git fetch origin main
          git checkout -B main origin/main

      - name: Add Madhubani theme layer
        run: |
          mkdir -p css
          cat > css/madhubani-theme.css <<'CSS'
:root {
  --mb-maroon:#A6243B; --mb-maroon-dark:#7D1A2D; --mb-mustard:#E8A33D;
  --mb-mustard-soft:#F3C66D; --mb-indigo:#1C3F72; --mb-indigo-dark:#142D52;
  --mb-cream:#FDF6E3; --mb-paper:#FFF9EC; --mb-ink:#2F241F; --mb-muted:#6C5A50;
  --mb-line:rgba(166,36,59,.22); --mb-shadow:0 18px 45px rgba(86,49,35,.14);
  --font-heading:"Eczar","Yatra One","Playfair Display",Georgia,serif;
  --font-body:"Poppins","Inter",Arial,sans-serif;
}
html,body{background:var(--mb-cream);color:var(--mb-ink)}
body{font-family:var(--font-body);background-image:radial-gradient(circle at 8% 12%,rgba(232,163,61,.1) 0 2px,transparent 2.5px),radial-gradient(circle at 92% 18%,rgba(166,36,59,.07) 0 2px,transparent 2.5px);background-size:34px 34px,42px 42px}
h1,h2,h3,h4,h5,h6,.section-title,.hero-title,.navbar-brand{font-family:var(--font-heading)}
section:not(.hero-section){position:relative}
section:not(.hero-section)::before{content:"";position:absolute;top:0;left:0;right:0;height:12px;pointer-events:none;opacity:.72;background:linear-gradient(135deg,transparent 38%,var(--mb-maroon) 39% 47%,transparent 48%) 0 0/18px 12px repeat-x,linear-gradient(45deg,transparent 38%,var(--mb-mustard) 39% 47%,transparent 48%) 9px 0/18px 12px repeat-x}
section:nth-of-type(even):not(.hero-section){background-color:var(--mb-paper);background-image:radial-gradient(circle at 18px 18px,rgba(28,63,114,.055) 0 1px,transparent 1.4px),radial-gradient(circle at 9px 9px,rgba(166,36,59,.045) 0 1px,transparent 1.4px);background-size:36px 36px}
.navbar{background:linear-gradient(180deg,rgba(28,63,114,.97),rgba(20,45,82,.94));border-bottom:3px solid var(--mb-mustard);box-shadow:0 10px 28px rgba(20,45,82,.22)}
.navbar-brand,.navbar .nav-link{color:#fffdf7!important}.navbar-brand i,.navbar .nav-link:hover,.navbar .nav-link.active,.navbar .navbar-brand:hover{color:var(--mb-mustard-soft)!important}.navbar .nav-link.active::after{background:var(--mb-mustard)!important;height:3px}
.navbar .dropdown-menu{background:var(--mb-paper);border:2px solid var(--mb-maroon);box-shadow:var(--mb-shadow);border-radius:14px}.navbar .dropdown-item{color:var(--mb-ink)}.navbar .dropdown-item:hover{background:rgba(232,163,61,.18);color:var(--mb-maroon)}
.hero-overlay{background:linear-gradient(90deg,rgba(20,45,82,.82),rgba(28,63,114,.48) 52%,rgba(166,36,59,.18))}.hero-location{background:rgba(253,246,227,.12);border-color:rgba(232,163,61,.7)}.hero-title span{color:var(--mb-mustard-soft)}
.btn,.btn-heritage,.btn-hero-primary,.btn-hero-secondary,.about-project-btn,.travel-cta-btn,button:not(.theme-toggle){border-radius:14px!important;font-family:var(--font-body);font-weight:600;transition:transform .22s ease,background-color .22s ease,box-shadow .22s ease}.btn:hover,.btn-heritage:hover,.btn-hero-primary:hover,.btn-hero-secondary:hover,.about-project-btn:hover,.travel-cta-btn:hover,button:not(.theme-toggle):hover{transform:translateY(-2px) scale(1.02)}
.btn-hero-primary,.btn-heritage,.travel-cta-btn,.about-project-btn{background:var(--mb-maroon);border-color:var(--mb-maroon);color:#fffdf7;box-shadow:0 10px 24px rgba(166,36,59,.22)}.btn-hero-primary:hover,.btn-heritage:hover,.travel-cta-btn:hover,.about-project-btn:hover{background:var(--mb-maroon-dark);border-color:var(--mb-maroon-dark)}.btn-hero-secondary{background:rgba(253,246,227,.1);border-color:var(--mb-mustard);color:#fffdf7}.btn-hero-secondary:hover{background:var(--mb-mustard);color:var(--mb-indigo-dark)}
.card,[class*="-card"],[class*="panel"],[class*="highlight"]{border-color:var(--mb-line)!important;box-shadow:var(--mb-shadow)}.card::after,[class*="-card"]::after{content:"";position:absolute;inset:6px;border:1px solid rgba(232,163,61,.34);border-radius:inherit;pointer-events:none}
.section-label,.section-eyebrow{color:var(--mb-maroon)!important}.section-title,.about-title,.about-project-content h2,.journey-heading h3,.site-search-box h2{color:var(--mb-indigo-dark)!important}.section-title::after,.about-title::after,.about-project-content h2::after,.journey-heading h3::after,.site-search-box h2::after{content:"✦";display:block;margin-top:8px;color:var(--mb-mustard);font-family:Georgia,serif;font-size:.7em;letter-spacing:8px}
input,textarea,select,.form-control,.form-select{background:#fffdf7!important;color:var(--mb-ink)!important;border-color:var(--mb-line)!important}input:focus,textarea:focus,select:focus,.form-control:focus,.form-select:focus{border-color:var(--mb-mustard)!important;box-shadow:0 0 0 4px rgba(232,163,61,.14)!important}
.site-footer{background:linear-gradient(180deg,var(--mb-indigo-dark),#0D1E36);color:rgba(253,246,227,.86);border-top:5px solid var(--mb-maroon)}.site-footer::before{content:"";display:block;height:14px;background:linear-gradient(135deg,transparent 35%,var(--mb-mustard) 36% 50%,transparent 51%) 0 0/20px 14px repeat-x,linear-gradient(45deg,transparent 35%,var(--mb-maroon) 36% 50%,transparent 51%) 10px 0/20px 14px repeat-x}.footer-logo,.footer-column h4,.footer-explore-link,.footer-column a:hover,.footer-socials a:hover{color:var(--mb-mustard-soft)!important}
.ask-bihar-launcher,.ask-bihar-send{background:var(--mb-maroon)!important}.ask-bihar-header{background:linear-gradient(135deg,var(--mb-indigo-dark),var(--mb-indigo))!important;border-bottom:3px solid var(--mb-mustard)}.ask-bihar-window,.ask-bihar-input-area,.ask-bihar-quick{background-color:var(--mb-paper)!important}.ask-bihar-message.user .ask-bihar-bubble{background:var(--mb-maroon)!important}.ask-bihar-quick button{border-color:var(--mb-line)!important;color:var(--mb-maroon)!important;background:rgba(232,163,61,.1)!important}
img{border-color:var(--mb-mustard)}
@media(max-width:991.98px){.navbar-collapse{background:rgba(20,45,82,.96);border:1px solid rgba(232,163,61,.3);border-radius:16px}}@media(max-width:575.98px){section:not(.hero-section)::before{height:8px;background-size:14px 8px,14px 8px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}}

/* Central light/dark theme tokens and visibility safety */
:root{--theme-text-primary:#2F241F;--theme-text-secondary:#6C5A50;--theme-text-on-dark:#FFF9EC;--theme-bg-primary:#FDF6E3;--theme-bg-secondary:#FFF9EC;--theme-bg-dark:#142D52;--theme-border:#D7BFA8;--theme-accent:#A6243B;--theme-accent-2:#E8A33D;--theme-link:#1C3F72;--theme-icon:#A6243B}
[data-theme="dark"],[data-bs-theme="dark"],.dark-mode,.dark,body.dark{--theme-text-primary:#FDF6E3;--theme-text-secondary:#E8D8C8;--theme-text-on-dark:#FFF9EC;--theme-bg-primary:#121820;--theme-bg-secondary:#1C2430;--theme-bg-dark:#0C1624;--theme-border:#44505F;--theme-accent:#D46A7E;--theme-accent-2:#F0C56B;--theme-link:#8DB7FF;--theme-icon:#F0C56B}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--theme-text-primary:#FDF6E3;--theme-text-secondary:#E8D8C8;--theme-text-on-dark:#FFF9EC;--theme-bg-primary:#121820;--theme-bg-secondary:#1C2430;--theme-bg-dark:#0C1624;--theme-border:#44505F;--theme-accent:#D46A7E;--theme-accent-2:#F0C56B;--theme-link:#8DB7FF;--theme-icon:#F0C56B}}
html,body{background:var(--theme-bg-primary)!important;color:var(--theme-text-primary)!important}
input,textarea,select,.form-control,.form-select{background:var(--theme-bg-secondary)!important;color:var(--theme-text-primary)!important;border-color:var(--theme-border)!important}input::placeholder,textarea::placeholder{color:var(--theme-text-secondary)!important;opacity:1!important}
a{color:var(--theme-link)}
.section-subtitle,.card p,.card .card-text,.card .text-muted,[class*="-card"] p,[class*="-card"] .card-text,[class*="-card"] .text-muted,.about-text,.about-lead,.journey-day p,.travel-info-card p,.text-muted{color:var(--theme-text-secondary)!important}
.section-title,.card h1,.card h2,.card h3,.card h4,.card h5,.card h6,[class*="-card"] h1,[class*="-card"] h2,[class*="-card"] h3,[class*="-card"] h4,[class*="-card"] h5,[class*="-card"] h6{color:var(--theme-text-primary)!important}
.hero-title,.hero-description,.hero-scroll,.hero-location,.image-overlay,.gallery-overlay,.gallery-caption,.card-overlay,[class*="overlay"] .title,[class*="overlay"] p{color:var(--theme-text-on-dark)!important}
.hero-title span,.hero-location i,.hero-scroll i{color:var(--theme-accent-2)!important}

/* Home — A Land of Timeless Stories: explicit contrast in both modes */
.about-bihar-section{background-color:var(--theme-bg-primary)!important;color:var(--theme-text-primary)!important}
.about-bihar-content,.about-bihar-content *{opacity:1!important}
.about-bihar-content .section-label{color:var(--theme-accent-2)!important}
.about-bihar-content .about-title{color:var(--theme-text-primary)!important;opacity:1!important}
.about-bihar-content .about-title span{color:var(--theme-accent-2)!important}
.about-bihar-content .about-lead,.about-bihar-content .about-text,.about-bihar-content p{color:var(--theme-text-secondary)!important;opacity:1!important}
.about-bihar-content .about-stat h3{color:var(--theme-text-primary)!important}
.about-bihar-content .about-stat p{color:var(--theme-text-secondary)!important}
.about-bihar-content .stat-icon{color:var(--theme-icon)!important}
.about-bihar-content .about-button{background:var(--theme-accent)!important;border-color:var(--theme-accent)!important;color:var(--theme-text-on-dark)!important}
[data-theme="dark"] .about-bihar-section,[data-bs-theme="dark"] .about-bihar-section,.dark-mode .about-bihar-section,.dark .about-bihar-section,body.dark .about-bihar-section{background-color:var(--theme-bg-primary)!important;color:var(--theme-text-primary)!important}
[data-theme="dark"] .about-bihar-content .about-title,[data-bs-theme="dark"] .about-bihar-content .about-title,.dark-mode .about-bihar-content .about-title,.dark .about-bihar-content .about-title,body.dark .about-bihar-content .about-title{color:var(--theme-text-primary)!important}
[data-theme="dark"] .about-bihar-content .about-lead,[data-theme="dark"] .about-bihar-content .about-text,[data-bs-theme="dark"] .about-bihar-content .about-lead,[data-bs-theme="dark"] .about-bihar-content .about-text,.dark-mode .about-bihar-content .about-lead,.dark-mode .about-bihar-content .about-text,.dark .about-bihar-content .about-lead,.dark .about-bihar-content .about-text,body.dark .about-bihar-content .about-lead,body.dark .about-bihar-content .about-text{color:var(--theme-text-secondary)!important}
CSS

      - name: Load theme on every page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in [Path('index.html'), *Path('pages').glob('*.html')]:
              s=p.read_text(encoding='utf-8')
              if 'madhubani-theme.css' in s:
                  continue
              rel='css/madhubani-theme.css' if p.name=='index.html' else '../css/madhubani-theme.css'
              tag=f'\n    <link rel="stylesheet" href="{rel}">\n'
              s=s.replace('</head>',tag+'</head>',1)
              p.write_text(s,encoding='utf-8')
          PY

      - name: Add Madhubani fonts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          tag='    <link rel="preconnect" href="https://fonts.googleapis.com">\n    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n    <link href="https://fonts.googleapis.com/css2?family=Eczar:wght@400;500;600;700&family=Yatra+One&display=swap" rel="stylesheet">\n'
          for p in [Path('index.html'), *Path('pages').glob('*.html')]:
              s=p.read_text(encoding='utf-8')
              if 'family=Eczar' not in s:
                  s=s.replace('</head>',tag+'</head>',1)
                  p.write_text(s,encoding='utf-8')
          PY

      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: apply Madhubani theme to Discover Bihar [skip ci]" || exit 0
          git push origin HEAD:main
